; NOTE: This file exists only so IDE tooling (PlatformIO / clangd IntelliSense)
; can resolve the C++ helper headers in include/. It is NOT used to build the
; firmware — `pio run` is not supported here. Real builds are driven by the
; ESPHome CLI (e.g. `esphome run esphome/temp_controller.yaml`), which manages
; its own PlatformIO project under esphome/.esphome/.
;
; The board values below are approximations for header resolution only
; (e.g. the ESP32 target is actually a Waveshare ESP32-C6-Zero).
; Host-side unit tests for include/ live in test/ — run ./test/run_tests.sh.

[env:esp8285]
platform = espressif8266
board = esp8285
framework = arduino

[env:esp32-c6-devkitc-1]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
