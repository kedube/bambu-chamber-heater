# ========================================
# FAHRENHEIT CONFIGURATION
# ========================================
# This file defines temperature unit settings and number entities for Fahrenheit operation.
# To use Celsius instead, switch the unit package in the selected top-level YAML.
#
# Temperature ranges are set to match the physical controller's capabilities:
#   - Operating thresholds: 32-185°F (0-85°C)
#   - Alarm limits: -40-230°F (-40-110°C)
#   - Calibration offset: ±18°F (±10°C)

substitutions:
  temp_unit: "Fahrenheit"
  temp_unit_label: "°F"
  # Unit-sensitive safety thresholds. These live in the unit packages (not
  # settings.yaml) because their values only make sense in one temperature unit.
  max_temp_rise_rate: "0.9" # °F/s - equivalent to the 0.5°C/s Celsius default
  overtemp_led_warning_threshold: "140.0" # °F - equivalent to the 60°C Celsius default

globals:
  # Filament-specific temperature presets with ±1°F hysteresis
  # Hysteresis prevents rapid relay cycling (chatter) by creating a 2°F operating band
  # Format: {name, {start_temp, stop_temp}} where start < stop for heating mode
  # Preset temps are defined in Celsius in main config, then converted here
  # Example: PLA at 22°C (71.6°F) becomes 70.6-72.6°F range
  # Note: For cooling mode, you would configure these with start > stop
  # Stored as a fixed-size std::array (see FilamentPresetEntry in preset_helper.h)
  # instead of a std::map to avoid per-node heap allocations; the array size below
  # must match the number of entries. C-to-F conversion is inlined because this
  # initializer is evaluated before preset_helper.h is included.
  - id: filament_presets
    type: std::array<std::pair<const char *, std::pair<float, float>>, 17>
    initial_value: |-
      {{
        {"PLA", {(${pla_temp} * 9.0f / 5.0f + 32.0f) - 1.0f, (${pla_temp} * 9.0f / 5.0f + 32.0f) + 1.0f}},
        {"TPU", {(${tpu_temp} * 9.0f / 5.0f + 32.0f) - 1.0f, (${tpu_temp} * 9.0f / 5.0f + 32.0f) + 1.0f}},
        {"PETG", {(${petg_temp} * 9.0f / 5.0f + 32.0f) - 1.0f, (${petg_temp} * 9.0f / 5.0f + 32.0f) + 1.0f}},
        {"PCTG", {(${pctg_temp} * 9.0f / 5.0f + 32.0f) - 1.0f, (${pctg_temp} * 9.0f / 5.0f + 32.0f) + 1.0f}},
        {"ABS", {(${abs_temp} * 9.0f / 5.0f + 32.0f) - 1.0f, (${abs_temp} * 9.0f / 5.0f + 32.0f) + 1.0f}},
        {"ASA", {(${asa_temp} * 9.0f / 5.0f + 32.0f) - 1.0f, (${asa_temp} * 9.0f / 5.0f + 32.0f) + 1.0f}},
        {"PC", {(${pc_temp} * 9.0f / 5.0f + 32.0f) - 1.0f, (${pc_temp} * 9.0f / 5.0f + 32.0f) + 1.0f}},
        {"PET", {(${pet_temp} * 9.0f / 5.0f + 32.0f) - 1.0f, (${pet_temp} * 9.0f / 5.0f + 32.0f) + 1.0f}},
        {"PA", {(${pa_temp} * 9.0f / 5.0f + 32.0f) - 1.0f, (${pa_temp} * 9.0f / 5.0f + 32.0f) + 1.0f}},
        {"PA6", {(${pa6_temp} * 9.0f / 5.0f + 32.0f) - 1.0f, (${pa6_temp} * 9.0f / 5.0f + 32.0f) + 1.0f}},
        {"PA12", {(${pa12_temp} * 9.0f / 5.0f + 32.0f) - 1.0f, (${pa12_temp} * 9.0f / 5.0f + 32.0f) + 1.0f}},
        {"PA612", {(${pa612_temp} * 9.0f / 5.0f + 32.0f) - 1.0f, (${pa612_temp} * 9.0f / 5.0f + 32.0f) + 1.0f}},
        {"PPA", {(${ppa_temp} * 9.0f / 5.0f + 32.0f) - 1.0f, (${ppa_temp} * 9.0f / 5.0f + 32.0f) + 1.0f}},
        {"PPS", {(${pps_temp} * 9.0f / 5.0f + 32.0f) - 1.0f, (${pps_temp} * 9.0f / 5.0f + 32.0f) + 1.0f}},
        {"PP", {(${pp_temp} * 9.0f / 5.0f + 32.0f) - 1.0f, (${pp_temp} * 9.0f / 5.0f + 32.0f) + 1.0f}},
        {"PE", {(${pe_temp} * 9.0f / 5.0f + 32.0f) - 1.0f, (${pe_temp} * 9.0f / 5.0f + 32.0f) + 1.0f}},
        {"PAHT", {(${paht_temp} * 9.0f / 5.0f + 32.0f) - 1.0f, (${paht_temp} * 9.0f / 5.0f + 32.0f) + 1.0f}}
      }}

number:
  # ========================================
  # TEMPERATURE THRESHOLDS (Operating Range)
  # ========================================
  # These define when the relay turns on/off during normal operation
  # Heating mode: low < high (e.g., start at 70°F, stop at 73°F)
  # Cooling mode: low > high (e.g., start at 73°F, stop at 70°F)
  # Range limited to safe operating range: 32-185°F
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Low Temp Threshold"
    address: 0x0006
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "${temp_unit_label}"
    min_value: 32
    max_value: 185
    step: 0.1
    mode: box
    entity_category: config
    lambda: "${temp_read_lambda}"
    write_lambda: "${temp_write_lambda}"
    id: temp_threshold_start
    icon: "mdi:temperature-low"
    web_server:
      sorting_group_id: sorting_group_settings

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "High Temp Threshold"
    address: 0x0007
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "${temp_unit_label}"
    min_value: 32
    max_value: 185
    step: 0.1
    mode: box
    entity_category: config
    lambda: "${temp_read_lambda}"
    write_lambda: "${temp_write_lambda}"
    id: temp_threshold_stop
    icon: "mdi:temperature-high"
    web_server:
      sorting_group_id: sorting_group_settings

  # ========================================
  # TEMPERATURE ALARMS (Safety Limits)
  # ========================================
  # These trigger emergency stops when exceeded (if over_temp_shutoff enabled)
  # Set beyond normal operating range to catch dangerous conditions
  # Example: If operating at 140°F, set high alarm to 158°F, low alarm to 41°F
  # Both heating and cooling modes can use these alarms for safety
  # Range: -40-230°F (controller's full measurement range)
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "High Temp Alarm"
    address: 0x0008
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "${temp_unit_label}"
    min_value: -40
    max_value: 230
    step: 0.1
    mode: box
    entity_category: config
    lambda: "${temp_read_lambda}"
    write_lambda: "${temp_write_lambda}"
    id: high_temp_alarm
    icon: "mdi:temperature-chevron-up"
    web_server:
      sorting_group_id: sorting_group_settings

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Low Temp Alarm"
    address: 0x0009
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "${temp_unit_label}"
    min_value: -40
    max_value: 230
    step: 0.1
    mode: box
    entity_category: config
    lambda: "${temp_read_lambda}"
    write_lambda: "${temp_write_lambda}"
    id: low_temp_alarm
    icon: "mdi:temperature-chevron-down"
    web_server:
      sorting_group_id: sorting_group_settings

  # ========================================
  # TEMPERATURE CALIBRATION
  # ========================================
  # Offset applied to temperature sensor reading for calibration
  # Positive values increase displayed temperature, negative values decrease
  # Example: If sensor reads 70°F but actual is 72°F, set offset to +2.0
  # Range: ±18°F (±10°C)
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Temp Offset"
    address: 0x000B
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "${temp_unit_label}"
    min_value: -18 
    max_value: 18
    step: 0.1
    mode: box
    entity_category: config
    lambda: "${temp_read_lambda}"
    write_lambda: "${temp_write_lambda}"
    id: temp_offset
    icon: "mdi:temperature-plus"
    web_server:
      sorting_group_id: sorting_group_settings
